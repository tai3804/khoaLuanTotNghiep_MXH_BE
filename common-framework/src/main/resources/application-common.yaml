spring:
  cache:
    type: ${CACHE_TYPE:redis} 
    redis:
      # Thời gian sống của cache (VD: 60m, 2h)
      time-to-live: ${CACHE_TTL_MINUTES:60m}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # password: ${REDIS_PASSWORD:}

app:
  security:
    jwt:
      issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080/auth}
      public-key: "${JWT_PUBLIC_KEY:-----BEGIN PUBLIC KEY-----  -----END PUBLIC KEY-----}"
