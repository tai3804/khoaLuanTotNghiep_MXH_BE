spring:
  cache:
    type: ${CACHE_TYPE:redis} 
    redis:
      # Thời gian sống của cache (VD: 60m, 2h)
      time-to-live: ${CACHE_TTL_MINUTES:60m}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  datasource:
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:2}
      minimum-idle: ${HIKARI_MIN_IDLE:1}

app:
  security:
    jwt:
      issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080/auth}
      public-key: "${JWT_PUBLIC_KEY}"
    # Khoá dùng chung cho API nội bộ /api/v1/internal/** (service gọi service, không đi qua gateway).
    # Giá trị mặc định chỉ dành cho máy dev: hãy đặt INTERNAL_API_KEY riêng (trong .env) khi triển khai thật.
    internal-api-key: ${INTERNAL_API_KEY:kltn-internal-dev-key}
    otp:
      length: ${SECURITY_OTP_LENGTH:6}
      ttl-minutes: ${SECURITY_OTP_TTL_MINUTES:5}
      reset-ttl-minutes: ${SECURITY_OTP_RESET_TTL_MINUTES:15}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: ${TRACING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
