name: Reusable Service Build & Deploy

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      service_name:
        description: 'Tên microservice cần build/deploy (VD: auth-service, post-service, api-gateway)'
        required: true
        default: 'auth-service'
        type: choice
        options:
          - eureka-server
          - api-gateway
          - auth-service
          - post-service
          - notification-service
          - media-service
          - user-service
          - call-service
          - chat-service
          - feed-service
          - admin-service
          - ai-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build common-framework
        if: inputs.service_name != 'eureka-server' && inputs.service_name != 'api-gateway'
        run: |
          chmod +x ./common-framework/mvnw
          ./common-framework/mvnw -f common-framework/pom.xml clean install -DskipTests

      - name: Build target service
        run: |
          chmod +x ./${{ inputs.service_name }}/mvnw
          ./${{ inputs.service_name }}/mvnw -f ${{ inputs.service_name }}/pom.xml clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (Optional)
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ inputs.service_name }}/Dockerfile
          push: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/kltn-{1}:latest', secrets.DOCKERHUB_USERNAME, inputs.service_name) || format('kltn-{0}:latest', inputs.service_name) }}
            ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/kltn-{1}:{2}', secrets.DOCKERHUB_USERNAME, inputs.service_name, github.sha) || format('kltn-{0}:{1}', inputs.service_name, github.sha) }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
