server:
  port: 8091

spring:
  application:
    name: ai-service
  config:
    import: classpath:application-common.yaml

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ai_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ai-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

ai:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
    api-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}
  moderation:
    enabled: ${AI_MODERATION_ENABLED:true}
    auto-learn-enabled: ${AI_AUTO_LEARN_ENABLED:true}
    thresholds:
      warn: ${AI_TOXICITY_THRESHOLD_WARN:0.40}
      hide: ${AI_TOXICITY_THRESHOLD_HIDE:0.65}
      delete: ${AI_TOXICITY_THRESHOLD_DELETE:0.85}

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
