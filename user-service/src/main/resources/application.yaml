server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: user-service
  config:
    import: classpath:application-common.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: user-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: iuh.fit.userservice.presentation.dto.event.UserRegisteredEvent
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/user_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# Điểm uy tín: bắt đầu ở mức tối đa, bị trừ theo từng loại vi phạm (xem ReputationService)
reputation:
  initial-score: 100
  penalty:
    warn: 5        # kiểm duyệt viên cảnh cáo
    auto-hide: 5   # bài tự bị ẩn vì nhiều báo cáo của cộng đồng
    hide: 10       # kiểm duyệt viên ẩn bài
    delete: 10     # kiểm duyệt viên gỡ bài
  recovery:
    points-per-day: 1   # mỗi ngày không bị trừ điểm được hồi phục chừng này điểm
  lock:
    days: 30            # điểm xuống dưới 10 (bậc Bị khóa) thì khóa tài khoản chừng này ngày
    restore-score: 30   # hết hạn khóa thì điểm được đặt lại mức này (bậc Yếu)
  maintenance:
    interval-ms: 3600000   # chu kỳ chạy công việc hồi điểm / mở khóa (mặc định mỗi giờ)
    initial-delay-ms: 120000

