server:
  port: ${SERVER_PORT:8085}

# Cỡ pool kết nối DB. application-common.yaml (được import và ghi đè file này) đọc ${HIKARI_MAX_POOL_SIZE:2} nên mặc định mỗi
# service chỉ có 2 kết nối. user-service vừa dùng JPA vừa dùng JdbcTemplate (tìm kiếm vector) trong cùng một request, tức là
# một request cần 2 kết nối cùng lúc: với pool 2 thì chỉ cần 2 request đồng thời là kẹt đến hết timeout 30 giây.
HIKARI_MAX_POOL_SIZE: 6

spring:
  application:
    name: user-service
  config:
    import: classpath:application-common.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: user-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "iuh.fit.*,java.util"
        spring.json.use.type.headers: false
        spring.json.value.default.type: iuh.fit.userservice.presentation.dto.event.UserRegisteredEvent
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/user_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 50
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# Điểm uy tín: bắt đầu ở mức tối đa, bị trừ theo từng loại vi phạm (xem ReputationService)
reputation:
  initial-score: 100
  penalty:
    warn: 5        # kiểm duyệt viên cảnh cáo
    auto-hide: 5   # bài tự bị ẩn vì nhiều báo cáo của cộng đồng
    hide: 10       # kiểm duyệt viên ẩn bài
    delete: 10     # kiểm duyệt viên gỡ bài
  recovery:
    points-per-day: 1   # mỗi ngày không bị trừ điểm được hồi phục chừng này điểm
  lock:
    days: 30            # điểm xuống dưới 10 (bậc Bị khóa) thì khóa tài khoản chừng này ngày
    restore-score: 30   # hết hạn khóa thì điểm được đặt lại mức này (bậc Yếu)
  maintenance:
    interval-ms: 3600000   # chu kỳ chạy công việc hồi điểm / mở khóa (mặc định mỗi giờ)
    initial-delay-ms: 120000
