server:
  port: ${SERVER_PORT:8083}

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: notification-service
  config:
    import: classpath:application-common.yaml
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.HashMap

fcm:
  credentials-file: ${FCM_CREDENTIALS_FILE:classpath:firebase-service-account.json}
  enabled: ${FCM_ENABLED:false}

brevo:
  api:
    url: ${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
    key: ${BREVO_API_KEY:your_api_key_here}
  sender:
    email: ${BREVO_SENDER_EMAIL:tranthanhtai1928@gmail.com}
    name: ${BREVO_SENDER_NAME:System Notification}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
