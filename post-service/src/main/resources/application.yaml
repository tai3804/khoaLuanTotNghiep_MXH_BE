server:
  port: ${SERVER_PORT:8082}

# Cỡ pool kết nối DB. application-common.yaml (được import và ghi đè file này) đọc ${HIKARI_MAX_POOL_SIZE:2}, nên khai báo
# spring.datasource.hikari.maximum-pool-size ở đây KHÔNG có tác dụng (pool thực tế chỉ 2). Biến môi trường vẫn ghi đè được.
# Aiven cho tối đa 100 kết nối cho cả 11 service nên giữ ở mức vừa phải.
HIKARI_MAX_POOL_SIZE: 8

spring:
  application:
    name: post-service
  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 160MB
      enabled: true
  config:
    import: classpath:application-common.yaml
  cache:
    redis:
      # Viewer-specific feed data. Short TTL limits stale friendship visibility;
      # writes explicitly evict these caches immediately.
      time-to-live: 30s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: post-group
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "iuh.fit.*,java.util"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.request.size: 157286400
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/post_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  jpa:
    # Mặc định Spring giữ kết nối DB của lần truy vấn JPA đầu tiên đến hết request (kể cả lúc chờ Gemini / gọi service khác).
    # Tìm kiếm bài viết còn dùng JdbcTemplate (xin thêm kết nối thứ hai) nên vài request đồng thời là cạn pool và kẹt đến hết
    # connection-timeout 30 giây. Tắt open-in-view: mỗi truy vấn tự mượn và trả kết nối.
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # Nạp collection EAGER (hashtag, allowedUserIds, taggedUserIds) theo lô thay vì N+1; bảng tin xếp hạng
        # (findRankingCandidates, tối đa 400 bài) giảm từ ~9s xuống ~1s khi CSDL ở cloud.
        default_batch_fetch_size: 50
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
