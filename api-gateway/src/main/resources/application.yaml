server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin, RETAIN_FIRST
        - DedupeResponseHeader=Access-Control-Allow-Credentials, RETAIN_FIRST
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth, /api/v1/auth/**, /api/v1/devices, /api/v1/devices/**
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users, /api/v1/users/**
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notifications, /api/v1/notifications/**
            - id: notification-service-ws
              uri: lb://notification-service
              predicates:
                - Path=/ws-notifications, /ws-notifications/**

            - id: media-service
              uri: lb://media-service
              predicates:
                - Path=/api/v1/media, /api/v1/media/**
            - id: feed-service
              uri: lb://feed-service
              predicates:
                - Path=/api/v1/feeds, /api/v1/feeds/**
            - id: post-service
              uri: lb://post-service
              predicates:
                - Path=/api/v1/posts, /api/v1/posts/**, /api/v1/stories, /api/v1/stories/**
            - id: chat-service
              uri: lb://chat-service
              predicates:
                - Path=/api/v1/chat, /api/v1/chat/**
            - id: chat-service-ws
              uri: lb://chat-service
              predicates:
                - Path=/ws-chat, /ws-chat/**
            - id: call-service
              uri: lb://call-service
              predicates:
                - Path=/api/v1/calls, /api/v1/calls/**, /api/v1/call, /api/v1/call/**
            - id: call-service-ws
              uri: lb://call-service
              predicates:
                - Path=/ws-call, /ws-call/**
            - id: moderation-service
              uri: lb://moderation-service
              predicates:
                - Path=/api/v1/moderation, /api/v1/moderation/**

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
