server:
  port: ${SERVER_PORT:8080}

rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  auth-capacity: ${RATE_LIMIT_AUTH_CAPACITY:5}
  auth-refill-seconds: ${RATE_LIMIT_AUTH_REFILL_SECONDS:30}
  ai-capacity: ${RATE_LIMIT_AI_CAPACITY:5}
  ai-refill-seconds: ${RATE_LIMIT_AI_REFILL_SECONDS:10}
  mutation-capacity: ${RATE_LIMIT_MUTATION_CAPACITY:10}
  mutation-refill-seconds: ${RATE_LIMIT_MUTATION_REFILL_SECONDS:30}
  general-capacity: ${RATE_LIMIT_GENERAL_CAPACITY:300}
  general-refill-seconds: ${RATE_LIMIT_GENERAL_REFILL_SECONDS:1}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - RemoveRequestHeader=X-Internal-Key
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
