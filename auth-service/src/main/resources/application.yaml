server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service
  config:
    import: classpath:application-common.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

app:
  security:
    jwt:
      private-key: "${JWT_PRIVATE_KEY}"
      issuer-uri: ${JWT_ISSUER_URI:https://auth.iuh.fit}
      expiration:
        access-token: ${JWT_ACCESS_TOKEN_EXPIRATION:30000}
        refresh-token: ${JWT_REFRESH_TOKEN_EXPIRATION:86400000}
  mfa:
    totp:
      issuer: ${MFA_TOTP_ISSUER:SocialNetworkApp}
      secret-size: ${MFA_TOTP_SECRET_SIZE:20}
      time-step-seconds: ${MFA_TOTP_TIME_STEP_SECONDS:30}
      code-digits: ${MFA_TOTP_CODE_DIGITS:6}
